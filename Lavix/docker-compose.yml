services:
  # Marketing site (www.lavix.in root). Built from the separate lavix-website
  # repo, which must be cloned alongside this one at ../../lavix-website.
  # It uses Git LFS for the videos — see DEPLOY.md before first build.
  marketing:
    build:
      context: ../lavix-website
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    environment:
      - ALLOWED_ORIGINS=https://lavix.in,https://www.lavix.in
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
    volumes:
      - /home/pudivineela25/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    restart: unless-stopped
    # Startup warms the 176MB rembg model, so "container started" lags "able to
    # serve" by a noticeable margin. start_period covers that without counting
    # those attempts as failures.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if 'ok' in urllib.request.urlopen('http://localhost:5000/health', timeout=5).read().decode() else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: https://www.lavix.in
        VITE_SUPABASE_URL: https://ycmrtqczhdcwtoekraxx.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbXJ0cWN6aGRjd3RvZWtyYXh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MzIxOTMsImV4cCI6MjEwMTMwODE5M30.gtPgt8_QrlZq0YanGKKPFgVcPsy007FpsmxfLh25V5k
        VITE_KIOSK_ID: LAVIX_KIOSK_001
    # NOTE: deliberately no `ports:` mapping.
    #
    # This VM also hosts SenseMinds (senseminds360.com). A shared Caddy proxy
    # owns 80/443 and routes by hostname; every app sits behind it and is
    # reached over the Docker network, not the host. Publishing 80/443 here
    # takes senseminds360.com down -- which is exactly what happened once when
    # Lavix was first deployed alongside it.
    #
    # This was carried for a while as an uncommitted local edit on the VM, so
    # the repo said one thing and production did another and every `git pull`
    # conflicted. Committed here so a fresh clone deploys correctly.
    expose:
      - "80"
      - "443"
    volumes:
      # Caddy proxies to this container's 443, so nginx still terminates TLS
      # internally and needs the cert.
      - /mnt/data/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - marketing
    restart: unless-stopped
