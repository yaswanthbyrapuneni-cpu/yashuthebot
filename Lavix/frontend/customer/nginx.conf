server {
    listen 80;
    server_name lavix.in www.lavix.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lavix.in www.lavix.in;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/lavix.crt;
    ssl_certificate_key /etc/nginx/ssl/lavix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # Emit relative Location headers. With absolute_redirect on (nginx's
    # default) the /tryon -> /tryon/ redirect is built from the incoming Host
    # header, which behind the shared Caddy proxy is the container name --
    # sending browsers to https://lavix-frontend-1/tryon/ and an NXDOMAIN.
    # Relative redirects resolve against whatever host the client actually used.
    absolute_redirect off;
    port_in_redirect off;

    # Docker's embedded DNS. Resolving the marketing upstream at request time
    # (via the variable below) instead of at config load means nginx still
    # starts if that container is briefly down, rather than crash-looping.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Backend API routes
    location ~ ^/(api|garments|try-on|health|tryon-status|send-alert|security-test)(/|$) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # Serve the kiosk icon for root-level favicon probes rather than sending
    # them through the Netlify proxy (which returns 503).
    location = /favicon.ico {
        alias /usr/share/nginx/html/tryon/favicon.svg;
        access_log off;
        log_not_found off;
    }

    # Kiosk SPA at /tryon
    location /tryon/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /tryon/index.html;
    }

    location = /tryon {
        return 301 /tryon/;
    }

    # Static asset caching for kiosk only
    location ~* ^/tryon/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Marketing website — served by the local `marketing` container.
    # (Was proxied to Netlify until that site hit its usage limits.)
    location / {
        set $marketing http://marketing:80;
        proxy_pass $marketing$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming the large intro video through a buffer would spool it to
        # disk and delay first paint; pass it straight through instead.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
