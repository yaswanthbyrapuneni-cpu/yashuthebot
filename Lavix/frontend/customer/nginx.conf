server {
    listen 80;
    server_name lavix.in www.lavix.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lavix.in www.lavix.in;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/lavix.crt;
    ssl_certificate_key /etc/nginx/ssl/lavix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    resolver 8.8.8.8 valid=300s;
    resolver_timeout 10s;

    # Backend API routes
    location ~ ^/(api|garments|try-on|health|tryon-status)(/|$) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # Kiosk SPA at /tryon
    location /tryon/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /tryon/index.html;
    }

    location = /tryon {
        return 301 /tryon/;
    }

    # Static asset caching for kiosk only
    location ~* ^/tryon/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Marketing website — proxy to Netlify
    location / {
        proxy_pass https://lavix-website.netlify.app;
        proxy_set_header Host lavix-website.netlify.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
