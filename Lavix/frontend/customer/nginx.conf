server {
    listen 80;
    server_name lavix.in www.lavix.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lavix.in www.lavix.in;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/lavix.crt;
    ssl_certificate_key /etc/nginx/ssl/lavix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy all backend routes (mixed /api/ prefix and non-prefixed)
    client_max_body_size 20m;
    location ~ ^/(api|garments|try-on|health|tryon-status)(/|$) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # Kiosk SPA at /tryon — all sub-routes fall back to index.html
    location /tryon/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /tryon/index.html;
    }

    # Redirect bare /tryon to /tryon/
    location = /tryon {
        return 301 /tryon/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
